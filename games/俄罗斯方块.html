<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俄罗斯方块</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  user-select: none;
  overflow: hidden;
}

.container {
  display: flex;
  gap: 30px;
  align-items: flex-start;
  padding: 20px;
}

.game-area {
  position: relative;
}

canvas#board {
  border: 3px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  background: rgba(0,0,0,0.6);
  box-shadow:
    0 0 30px rgba(100,100,255,0.15),
    0 0 60px rgba(100,100,255,0.05),
    inset 0 0 30px rgba(0,0,0,0.3);
}

.side-panel {
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-width: 170px;
}

.panel-box {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 18px;
  backdrop-filter: blur(10px);
}

.panel-box h3 {
  color: rgba(255,255,255,0.5);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 12px;
  text-align: center;
}

canvas#next {
  display: block;
  margin: 0 auto;
  background: rgba(0,0,0,0.3);
  border-radius: 6px;
}

.stat {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.stat:last-child { border-bottom: none; }

.stat-label {
  color: rgba(255,255,255,0.5);
  font-size: 13px;
}

.stat-value {
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.controls-info {
  margin-top: 6px;
}

.control-row {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  font-size: 12px;
  color: rgba(255,255,255,0.4);
}

.control-row span:last-child {
  color: rgba(255,255,255,0.7);
  font-family: monospace;
  font-size: 13px;
}

.overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.75);
  border-radius: 8px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 10;
}

.overlay.show {
  opacity: 1;
  pointer-events: all;
}

.overlay h2 {
  color: #fff;
  font-size: 32px;
  margin-bottom: 16px;
  text-shadow: 0 0 20px rgba(150,150,255,0.5);
}

.overlay .score-text {
  color: rgba(255,255,255,0.7);
  font-size: 18px;
  margin-bottom: 24px;
}

.btn {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  border: none;
  padding: 12px 36px;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  letter-spacing: 1px;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 20px rgba(102,126,234,0.3);
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 30px rgba(102,126,234,0.5);
}

.btn:active {
  transform: translateY(0);
}

.pause-btn {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.8);
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  width: 100%;
}

.pause-btn:hover {
  background: rgba(255,255,255,0.15);
}

.combo-pop {
  position: absolute;
  color: #ffd700;
  font-size: 24px;
  font-weight: 700;
  pointer-events: none;
  animation: comboFloat 0.8s ease-out forwards;
  text-shadow: 0 0 10px rgba(255,215,0,0.6);
}

@keyframes comboFloat {
  0% { transform: translateY(0) scale(0.5); opacity: 1; }
  100% { transform: translateY(-60px) scale(1.2); opacity: 0; }
}

@media (max-width: 600px) {
  .container {
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .side-panel {
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
  }
}
</style>
</head>
<body>

<a href="../games.html" style="position:fixed;top:16px;left:20px;z-index:100;color:rgba(255,255,255,.5);text-decoration:none;font-size:14px;font-family:'Microsoft YaHei',sans-serif;transition:color .3s;" onmouseover="this.style.color='#667eea'" onmouseout="this.style.color='rgba(255,255,255,.5)'">← 退出游戏</a>
<div class="container">
  <div class="game-area" id="gameArea">
    <canvas id="board"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">俄罗斯方块</h2>
      <div class="score-text" id="overlayScore"></div>
      <button class="btn" id="overlayBtn">开始游戏</button>
    </div>
  </div>

  <div class="side-panel">
    <div class="panel-box">
      <h3>下一个</h3>
      <canvas id="next" width="120" height="120"></canvas>
    </div>

    <div class="panel-box">
      <div class="stat">
        <span class="stat-label">分数</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">等级</span>
        <span class="stat-value" id="level">1</span>
      </div>
      <div class="stat">
        <span class="stat-label">行数</span>
        <span class="stat-value" id="lines">0</span>
      </div>
    </div>

    <div class="panel-box controls-info">
      <h3>操作</h3>
      <div class="control-row"><span>左移</span><span>← / A</span></div>
      <div class="control-row"><span>右移</span><span>→ / D</span></div>
      <div class="control-row"><span>旋转</span><span>↑ / W</span></div>
      <div class="control-row"><span>软降</span><span>↓ / S</span></div>
      <div class="control-row"><span>硬降</span><span>空格</span></div>
      <div class="control-row" style="margin-top:6px;border-top:1px solid rgba(255,255,255,0.08);padding-top:6px">
        <span>暂停</span><span>P</span>
      </div>
    </div>

    <button class="pause-btn" id="pauseBtn">暂停</button>
  </div>
</div>

<script>
(function() {
  // ── 常量 ──
  const COLS = 10;
  const ROWS = 20;
  const CELL = 30;
  const NEXT_CELL = 24;

  // ── 七种形状定义 ──
  const PIECES = [
    { // I
      shape: [[1,1,1,1]],
      color: '#00f0f0'
    },
    { // O
      shape: [[1,1],[1,1]],
      color: '#f0f000'
    },
    { // T
      shape: [[0,1,0],[1,1,1]],
      color: '#a000f0'
    },
    { // S
      shape: [[0,1,1],[1,1,0]],
      color: '#00f000'
    },
    { // Z
      shape: [[1,1,0],[0,1,1]],
      color: '#f00000'
    },
    { // J
      shape: [[1,0,0],[1,1,1]],
      color: '#0000f0'
    },
    { // L
      shape: [[0,0,1],[1,1,1]],
      color: '#f0a000'
    }
  ];

  // ── DOM & Canvas ──
  const boardCanvas = document.getElementById('board');
  const boardCtx = boardCanvas.getContext('2d');
  const nextCanvas = document.getElementById('next');
  const nextCtx = nextCanvas.getContext('2d');

  boardCanvas.width = COLS * CELL;
  boardCanvas.height = ROWS * CELL;

  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayScore = document.getElementById('overlayScore');
  const overlayBtn = document.getElementById('overlayBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const linesEl = document.getElementById('lines');
  const gameArea = document.getElementById('gameArea');

  // ── 音效（简易 Web Audio） ──
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function beep(freq, duration, type = 'square', vol = 0.06) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function sfxMove()       { beep(200, 0.05, 'square', 0.04); }
  function sfxRotate()     { beep(300, 0.06, 'triangle', 0.05); }
  function sfxDrop()       { beep(80, 0.1, 'triangle', 0.06); }
  function sfxClear(n)     { beep(400 + n * 80, 0.15, 'square', 0.07); }
  function sfxGameOver()   { beep(80, 0.4, 'sawtooth', 0.08); }

  // ── 状态 ──
  let board = [];
  let current = null;   // { shape, color, x, y }
  let nextPiece = null;
  let score = 0;
  let level = 1;
  let linesCleared = 0;
  let gameRunning = false;
  let paused = false;
  let dropInterval = 800;
  let lastDrop = 0;
  let animationId = null;

  // ── 初始化/重置棋盘 ──
  function createBoard() {
    board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  }

  // ── 随机取块 ──
  function randomPiece() {
    const p = PIECES[Math.floor(Math.random() * PIECES.length)];
    return { shape: p.shape.map(r => [...r]), color: p.color };
  }

  // ── 生成当前块 ──
  function spawnPiece() {
    current = nextPiece || randomPiece();
    nextPiece = randomPiece();
    current.x = Math.floor((COLS - current.shape[0].length) / 2);
    current.y = 0;
    if (!isValid(current.shape, current.x, current.y)) {
      gameOver();
      return false;
    }
    return true;
  }

  // ── 碰撞检测 ──
  function isValid(shape, x, y) {
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (!shape[r][c]) continue;
        const bx = x + c;
        const by = y + r;
        if (bx < 0 || bx >= COLS || by >= ROWS) return false;
        if (by < 0) continue;
        if (board[by][bx] !== null) return false;
      }
    }
    return true;
  }

  // ── 移动 ──
  function movePiece(dx, dy) {
    if (!current || !gameRunning || paused) return false;
    if (isValid(current.shape, current.x + dx, current.y + dy)) {
      current.x += dx;
      current.y += dy;
      return true;
    }
    return false;
  }

  // ── 旋转 ──
  function rotatePiece() {
    if (!current || !gameRunning || paused) return;
    const shape = current.shape;
    const rotated = shape[0].map((_, i) => shape.map(r => r[i]).reverse());
    // 墙踢：尝试原位置及左右偏移
    const kicks = [0, -1, 1, -2, 2];
    for (const dx of kicks) {
      if (isValid(rotated, current.x + dx, current.y)) {
        current.shape = rotated;
        current.x += dx;
        sfxRotate();
        return;
      }
      // 也尝试上移
      if (isValid(rotated, current.x + dx, current.y - 1)) {
        current.shape = rotated;
        current.x += dx;
        current.y -= 1;
        sfxRotate();
        return;
      }
    }
  }

  // ── 硬降 ──
  function hardDrop() {
    if (!current || !gameRunning || paused) return;
    let dy = 0;
    while (isValid(current.shape, current.x, current.y + dy + 1)) dy++;
    current.y += dy;
    score += dy * 2;
    sfxDrop();
    lockPiece();
  }

  // ── 锁定当前块 ──
  function lockPiece() {
    if (!current) return;
    const { shape, color, x, y } = current;
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (!shape[r][c]) continue;
        const by = y + r;
        const bx = x + c;
        if (by < 0) { gameOver(); return; }
        board[by][bx] = color;
      }
    }
    clearLines();
    spawnPiece();
  }

  // ── 消行 ──
  function clearLines() {
    let cleared = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r].every(cell => cell !== null)) {
        board.splice(r, 1);
        board.unshift(Array(COLS).fill(null));
        cleared++;
        r++; // 回检同一行
      }
    }
    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800];
      score += points[cleared] * level;
      linesCleared += cleared;
      level = Math.floor(linesCleared / 10) + 1;
      dropInterval = Math.max(50, 800 - (level - 1) * 70);
      sfxClear(cleared);
      // 连消弹字
      if (cleared >= 2) showCombo(cleared);
    }
  }

  function showCombo(n) {
    const texts = { 2: '双消!', 3: '三消!!', 4: '🎉 TETRIS!!' };
    const pop = document.createElement('div');
    pop.className = 'combo-pop';
    pop.textContent = texts[n] || `${n}消!`;
    const rect = boardCanvas.getBoundingClientRect();
    pop.style.left = rect.width / 2 + 'px';
    pop.style.top = rect.height / 2 + 'px';
    gameArea.appendChild(pop);
    setTimeout(() => pop.remove(), 800);
  }

  // ── 游戏结束 ──
  function gameOver() {
    gameRunning = false;
    current = null;
    sfxGameOver();
    overlayTitle.textContent = '游戏结束';
    overlayScore.textContent = `最终得分：${score}`;
    overlayBtn.textContent = '再来一局';
    overlay.classList.add('show');
    pauseBtn.textContent = '暂停';
  }

  // ── 暂停/继续 ──
  function togglePause() {
    if (!gameRunning) return;
    paused = !paused;
    if (paused) {
      pauseBtn.textContent = '继续';
      overlayTitle.textContent = '已暂停';
      overlayScore.textContent = '';
      overlayBtn.textContent = '继续';
      overlay.classList.add('show');
    } else {
      pauseBtn.textContent = '暂停';
      overlay.classList.remove('show');
      lastDrop = performance.now();
    }
  }

  // ── 游戏循环 ──
  function gameLoop(timestamp) {
    if (!gameRunning) { animationId = requestAnimationFrame(gameLoop); draw(); return; }
    if (paused) { animationId = requestAnimationFrame(gameLoop); return; }

    if (timestamp - lastDrop > dropInterval) {
      if (!movePiece(0, 1)) {
        lockPiece();
      }
      lastDrop = timestamp;
    }

    // 更新 UI
    scoreEl.textContent = score;
    levelEl.textContent = level;
    linesEl.textContent = linesCleared;

    draw();
    animationId = requestAnimationFrame(gameLoop);
  }

  // ── 绘制 ──
  function draw() {
    const ctx = boardCtx;
    ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);

    // 网格线
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 0.5;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        ctx.strokeRect(c * CELL, r * CELL, CELL, CELL);
      }
    }

    // 已落块
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (board[r][c]) drawCell(ctx, c, r, board[r][c], CELL);
      }
    }

    // 当前块
    if (current) {
      const { shape, color, x, y } = current;
      // 投影
      let ghostY = y;
      while (isValid(shape, x, ghostY + 1)) ghostY++;
      if (ghostY !== y) {
        for (let r = 0; r < shape.length; r++) {
          for (let c = 0; c < shape[r].length; c++) {
            if (shape[r][c]) {
              drawCell(ctx, x + c, ghostY + r, color, CELL, 0.15);
            }
          }
        }
      }
      // 实际块
      for (let r = 0; r < shape.length; r++) {
        for (let c = 0; c < shape[r].length; c++) {
          if (shape[r][c]) {
            drawCell(ctx, x + c, y + r, color, CELL);
          }
        }
      }
    }

    // 下一个块预览
    drawNext();
  }

  function drawCell(ctx, cx, cy, color, size, alpha = 1) {
    const x = cx * size;
    const y = cy * size;
    const pad = 1.5;

    ctx.globalAlpha = alpha;

    // 主体
    ctx.fillStyle = color;
    ctx.fillRect(x + pad, y + pad, size - pad * 2, size - pad * 2);

    // 亮面（左上）
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(x + pad, y + pad, size - pad * 2, 3);
    ctx.fillRect(x + pad, y + pad, 3, size - pad * 2);

    // 暗面（右下）
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(x + pad, y + size - pad - 3, size - pad * 2, 3);
    ctx.fillRect(x + size - pad - 3, y + pad, 3, size - pad * 2);

    // 光泽
    const grd = ctx.createLinearGradient(x + pad, y + pad, x + size - pad, y + size - pad);
    grd.addColorStop(0, 'rgba(255,255,255,0.12)');
    grd.addColorStop(0.5, 'rgba(255,255,255,0)');
    grd.addColorStop(1, 'rgba(0,0,0,0.1)');
    ctx.fillStyle = grd;
    ctx.fillRect(x + pad, y + pad, size - pad * 2, size - pad * 2);

    ctx.globalAlpha = 1;
  }

  function drawNext() {
    const ctx = nextCtx;
    ctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (!nextPiece) return;

    const shape = nextPiece.shape;
    const color = nextPiece.color;
    const rows = shape.length;
    const cols = shape[0].length;

    // 居中偏移
    const offsetX = (nextCanvas.width - cols * NEXT_CELL) / 2;
    const offsetY = (nextCanvas.height - rows * NEXT_CELL) / 2;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (shape[r][c]) {
          ctx.globalAlpha = 1;
          const x = offsetX + c * NEXT_CELL;
          const y = offsetY + r * NEXT_CELL;
          const pad = 1.5;

          ctx.fillStyle = color;
          ctx.fillRect(x + pad, y + pad, NEXT_CELL - pad * 2, NEXT_CELL - pad * 2);

          ctx.fillStyle = 'rgba(255,255,255,0.2)';
          ctx.fillRect(x + pad, y + pad, NEXT_CELL - pad * 2, 3);
          ctx.fillRect(x + pad, y + pad, 3, NEXT_CELL - pad * 2);

          ctx.fillStyle = 'rgba(0,0,0,0.2)';
          ctx.fillRect(x + pad, y + NEXT_CELL - pad - 3, NEXT_CELL - pad * 2, 3);
          ctx.fillRect(x + NEXT_CELL - pad - 3, y + pad, 3, NEXT_CELL - pad * 2);
        }
      }
    }
  }

  // ── 开始游戏 ──
  function startGame() {
    initAudio();
    createBoard();
    score = 0;
    level = 1;
    linesCleared = 0;
    dropInterval = 800;
    gameRunning = true;
    paused = false;
    nextPiece = null;
    current = null;

    scoreEl.textContent = '0';
    levelEl.textContent = '1';
    linesEl.textContent = '0';
    pauseBtn.textContent = '暂停';

    overlay.classList.remove('show');
    spawnPiece();
    lastDrop = performance.now();
  }

  // ── 事件绑定 ──
  overlayBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    initAudio();
    if (paused) {
      togglePause();
    } else {
      startGame();
    }
  });

  pauseBtn.addEventListener('click', togglePause);

  document.addEventListener('keydown', (e) => {
    if (!gameRunning) return;
    if (e.key === 'p' || e.key === 'P') { togglePause(); return; }
    if (paused) return;

    switch (e.key) {
      case 'ArrowLeft': case 'a': case 'A':
        if (movePiece(-1, 0)) sfxMove();
        e.preventDefault();
        break;
      case 'ArrowRight': case 'd': case 'D':
        if (movePiece(1, 0)) sfxMove();
        e.preventDefault();
        break;
      case 'ArrowDown': case 's': case 'S':
        if (movePiece(0, 1)) { sfxMove(); score += 1; }
        e.preventDefault();
        break;
      case 'ArrowUp': case 'w': case 'W':
        rotatePiece();
        e.preventDefault();
        break;
      case ' ':
        hardDrop();
        e.preventDefault();
        break;
    }
  });

  // ── 移动端触摸支持 ──
  let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
  boardCanvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchStartTime = Date.now();
  });

  boardCanvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (!gameRunning || paused) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const dt = Date.now() - touchStartTime;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);

    if (absDx < 5 && absDy < 5 && dt < 200) {
      rotatePiece(); // 点击旋转
    } else if (absDy > absDx && dy > 40 && dt < 400) {
      hardDrop(); // 快速下滑 = 硬降
    } else if (absDx > absDy && absDx > 20) {
      movePiece(dx > 0 ? 1 : -1, 0);
    }
  });

  // ── 初始绘制 ──
  createBoard();
  nextPiece = randomPiece();
  draw();
  overlay.classList.add('show');
  overlayTitle.textContent = '俄罗斯方块';
  overlayScore.textContent = '';
  overlayBtn.textContent = '开始游戏';

  // 启动循环
  animationId = requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
