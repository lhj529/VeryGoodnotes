<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; color: #eee; overflow: hidden; user-select: none;
  }
  .game-container {
    position: relative;
    width: 400px; max-width: 95vw;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .header {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    padding: 0 4px;
  }
  .title { font-size: 26px; font-weight: 800; letter-spacing: 2px; color: #4ecca3; text-shadow: 0 0 20px rgba(78,204,163,.4); }
  .scores { display: flex; gap: 20px; }
  .score-box { text-align: center; }
  .score-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .score-value { font-size: 22px; font-weight: 700; color: #eee; }
  .score-value.best { color: #ffd700; }
  canvas {
    border-radius: 12px; background: #0d1b2a;
    box-shadow: 0 0 40px rgba(0,0,0,.5), inset 0 0 60px rgba(78,204,163,.05);
    touch-action: none;
  }
  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(13,27,42,.92); border-radius: 12px; gap: 18px;
    opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 10;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay h2 { font-size: 28px; font-weight: 800; }
  .overlay.gameover h2 { color: #e94560; }
  .overlay.start h2 { color: #4ecca3; }
  .overlay.pause h2 { color: #ffd700; }
  .overlay p { font-size: 14px; color: #aaa; text-align: center; line-height: 1.8; }
  .overlay p span { color: #4ecca3; font-weight: 600; }
  .btn {
    padding: 12px 36px; font-size: 16px; font-weight: 700; letter-spacing: 1px;
    border: none; border-radius: 30px; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, #4ecca3, #2d8a6f);
    box-shadow: 0 4px 20px rgba(78,204,163,.4); transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(78,204,163,.55); }
  .btn:active { transform: translateY(0); }
  .controls-hint {
    font-size: 12px; color: #555; text-align: center; line-height: 1.6;
  }
  .mobile-controls { display: none; grid-template-columns: repeat(3,56px); grid-template-rows: repeat(3,56px); gap: 6px; margin-top: 4px; }
  .mobile-controls button {
    background: rgba(78,204,163,.15); border: 1px solid rgba(78,204,163,.3); border-radius: 10px;
    color: #4ecca3; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .mobile-controls button:active { background: rgba(78,204,163,.35); }
  .mc-up { grid-column: 2; grid-row: 1; }
  .mc-left { grid-column: 1; grid-row: 2; }
  .mc-right { grid-column: 3; grid-row: 2; }
  .mc-down { grid-column: 2; grid-row: 3; }
  @media (pointer: coarse) { .mobile-controls { display: grid; } .controls-hint { display: none; } }
</style>
</head>
<body>
<a href="../games.html" style="position:fixed;top:16px;left:20px;z-index:100;color:rgba(255,255,255,.5);text-decoration:none;font-size:14px;transition:color .3s;" onmouseover="this.style.color='#4ecca3'" onmouseout="this.style.color='rgba(255,255,255,.5)'">← 返回游戏中心</a>
<div class="game-container">
  <div class="header">
    <div class="title">🐍 贪吃蛇</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">得分</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">最高</div>
        <div class="score-value best" id="best">0</div>
      </div>
    </div>
  </div>
  <div style="position:relative;">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div class="overlay start show" id="overlay">
      <h2>🐍 贪吃蛇</h2>
      <p>用 <span>方向键</span> 或 <span>WASD</span> 控制方向<br>按 <span>空格</span> 暂停<br>吃到食物得分，别撞墙和自己</p>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>
  </div>
  <div class="controls-hint">方向键 / WASD 移动 · 空格暂停</div>
  <div class="mobile-controls">
    <button class="mc-up" data-dir="up">▲</button>
    <button class="mc-left" data-dir="left">◀</button>
    <button class="mc-right" data-dir="right">▶</button>
    <button class="mc-down" data-dir="down">▼</button>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');

  const GRID = 20;          // 每格像素
  const COLS = canvas.width / GRID;   // 20
  const ROWS = canvas.height / GRID;  // 20

  let snake, dir, nextDir, food, score, best, speed, loop, running, paused;

  best = parseInt(localStorage.getItem('snake_best') || '0', 10);
  bestEl.textContent = best;

  function reset() {
    snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    dir = {x:1, y:0};
    nextDir = {x:1, y:0};
    score = 0;
    speed = 130;
    scoreEl.textContent = score;
    placeFood();
    running = false;
    paused = false;
    draw();
  }

  function placeFood() {
    let valid = false;
    while (!valid) {
      food = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
      valid = !snake.some(s => s.x === food.x && s.y === food.y);
    }
  }

  function start() {
    if (running) return;
    reset();
    running = true;
    overlay.classList.remove('show');
    clearTimeout(loop);
    tick();
  }

  function tick() {
    if (!running || paused) return;
    update();
    draw();
    loop = setTimeout(tick, speed);
  }

  function update() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
    // 撞自己
    if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (speed > 60) speed -= 3; // 加速
      placeFood();
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    running = false;
    clearTimeout(loop);
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      bestEl.textContent = best;
    }
    overlay.className = 'overlay gameover show';
    overlay.innerHTML = '<h2>💀 游戏结束</h2>' +
      '<p>本次得分 <span>' + score + '</span><br>最高记录 <span>' + best + '</span></p>' +
      '<button class="btn" id="startBtn">再来一局</button>';
    document.getElementById('startBtn').addEventListener('click', start);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function draw() {
    // 背景
    ctx.fillStyle = '#0d1b2a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 网格线
    ctx.strokeStyle = 'rgba(255,255,255,.03)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i*GRID, 0); ctx.lineTo(i*GRID, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*GRID); ctx.lineTo(canvas.width, i*GRID); ctx.stroke();
    }

    // 食物（发光苹果）
    const fx = food.x * GRID, fy = food.y * GRID;
    const grad = ctx.createRadialGradient(fx+GRID/2, fy+GRID/2, 1, fx+GRID/2, fy+GRID/2, GRID);
    grad.addColorStop(0, '#ff6b6b');
    grad.addColorStop(.6, '#e94560');
    grad.addColorStop(1, 'rgba(233,69,96,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(fx-4, fy-4, GRID+8, GRID+8);
    ctx.fillStyle = '#ff6b6b';
    roundRect(fx+3, fy+3, GRID-6, GRID-6, 5);
    ctx.fill();

    // 蛇身
    snake.forEach(function(seg, i) {
      const x = seg.x * GRID, y = seg.y * GRID;
      if (i === 0) {
        // 蛇头
        ctx.fillStyle = '#4ecca3';
        roundRect(x+1, y+1, GRID-2, GRID-2, 6);
        ctx.fill();
        ctx.shadowColor = '#4ecca3';
        ctx.shadowBlur = 12;
        roundRect(x+1, y+1, GRID-2, GRID-2, 6);
        ctx.fill();
        ctx.shadowBlur = 0;
        // 眼睛
        ctx.fillStyle = '#0d1b2a';
        const ex = dir.x, ey = dir.y;
        const cx = x + GRID/2, cy = y + GRID/2;
        const eo = 3; // eye offset along dir
        const ep = 4; // eye perpendicular spread
        if (ex !== 0) {
          ctx.beginPath(); ctx.arc(cx + ex*eo, cy - ep, 2, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(cx + ex*eo, cy + ep, 2, 0, Math.PI*2); ctx.fill();
        } else {
          ctx.beginPath(); ctx.arc(cx - ep, cy + ey*eo, 2, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(cx + ep, cy + ey*eo, 2, 0, Math.PI*2); ctx.fill();
        }
      } else {
        // 蛇身渐变
        const t = i / snake.length;
        const r = Math.round(78 + (30-78)*t);
        const g = Math.round(204 + (120-204)*t);
        const b = Math.round(163 + (90-163)*t);
        ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
        roundRect(x+2, y+2, GRID-4, GRID-4, 5);
        ctx.fill();
      }
    });
  }

  function setDir(x, y) {
    // 不能180度掉头
    if (dir.x === -x && dir.y === -y) return;
    if (dir.x === x && dir.y === y) return;
    nextDir = {x: x, y: y};
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      overlay.className = 'overlay pause show';
      overlay.innerHTML = '<h2>⏸ 已暂停</h2><p>按 <span>空格</span> 继续</p>';
    } else {
      overlay.classList.remove('show');
      tick();
    }
  }

  // 键盘
  document.addEventListener('keydown', function(e) {
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()) || ['w','a','s','d'].includes(k)) {
      e.preventDefault();
    }
    if (k === 'arrowup' || k === 'w') setDir(0, -1);
    else if (k === 'arrowdown' || k === 's') setDir(0, 1);
    else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
    else if (k === 'arrowright' || k === 'd') setDir(1, 0);
    else if (k === ' ') {
      if (!running) start(); else togglePause();
    }
  });

  // 移动端方向按钮
  document.querySelectorAll('.mobile-controls button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const d = btn.dataset.dir;
      if (d === 'up') setDir(0, -1);
      else if (d === 'down') setDir(0, 1);
      else if (d === 'left') setDir(-1, 0);
      else if (d === 'right') setDir(1, 0);
    });
  });

  // 触屏滑动
  let touchStart = null;
  canvas.addEventListener('touchstart', function(e) {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, {passive: true});
  canvas.addEventListener('touchmove', function(e) {
    if (!touchStart) return;
    const dx = e.touches[0].clientX - touchStart.x;
    const dy = e.touches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 1 : -1, 0);
    } else {
      setDir(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  }, {passive: true});

  startBtn.addEventListener('click', start);

  // 初始画面
  reset();
})();
</script>
</body>
</html>
