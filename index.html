<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阅读笔记 - 首页</title>
    <style>
        :root {
            --brand-color: #2d6a4f;
            --brand-light: rgba(240, 249, 244, 0.9);
            --brand-hover: rgba(220, 237, 226, 0.95);
            --text-main: #1a202c;
            --nav-bg: rgba(255, 255, 255, 0.85);
        }

        body { 
            margin: 0; font-family: "Georgia", "PingFang SC", serif; 
            background-image: url('sea.avif');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: var(--text-main); padding-top: 80px;
            overflow-x: hidden;
        }

        /* --- 导航栏优化 --- */
        .top-nav {
            position: fixed; top: 0; width: 100%; 
            min-height: 70px; /* 改为最小高度，允许换行撑开 */
            background: var(--nav-bg); backdrop-filter: blur(12px);
            z-index: 1000; display: flex; align-items: center; justify-content: space-between; 
            padding: 10px 40px; box-sizing: border-box; box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            flex-wrap: wrap; /* 关键：允许子元素换行 */
        }
        .nav-left { font-weight: bold; color: var(--brand-color); font-size: 1.2rem; cursor: pointer; text-decoration: none; flex-shrink: 0; margin-bottom: 5px; }
        
        .nav-search-container {
            flex-grow: 1;
            max-width: 400px;
            margin: 0 20px;
            position: relative;
            display: flex;
            align-items: center;
        }
        .nav-search-input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            border-radius: 25px;
            border: 1px solid rgba(45, 106, 79, 0.2);
            background: rgba(255, 255, 255, 0.7);
            outline: none;
            transition: 0.3s;
            font-size: 0.9rem;
        }
        .nav-search-input:focus {
            background: #fff;
            border-color: var(--brand-color);
            box-shadow: 0 0 10px rgba(45, 106, 79, 0.1);
        }
        .search-icon {
            position: absolute;
            left: 15px;
            color: var(--brand-color);
            opacity: 0.6;
        }

        .nav-right { 
            display: flex; 
            gap: 15px; 
            align-items: center; 
            flex-shrink: 0; 
            flex-wrap: wrap; /* 关键：允许按钮换行 */
            justify-content: flex-end;
        }
        .nav-link { text-decoration: none; color: var(--text-main); font-size: 0.95rem; font-weight: 500; transition: 0.3s; white-space: nowrap; padding: 5px 0; }
        .nav-link:hover { color: var(--brand-color); }
        
        .nav-link.add-btn { color: var(--brand-color); font-weight: bold; }

        .music-btn {
            background: none; border: none; cursor: pointer; color: var(--text-main);
            font-size: 0.95rem; font-weight: 500; padding: 4px 8px; border-radius: 6px;
            transition: color 0.3s; display: inline-flex; align-items: center;
            justify-content: center; text-decoration: none; line-height: 1.2;
        }
        .music-btn:hover { color: var(--brand-color); }

        .hero-cta-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--brand-color), #40916c);
            color: white !important;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(45, 106, 79, 0.3);
            transition: all 0.3s ease;
            animation: breathe 3s infinite ease-in-out;
        }
        .hero-cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(45, 106, 79, 0.4);
            filter: brightness(1.1);
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
        }

        /* --- 悬浮添加按钮 --- */
        .float-add-btn {
            position: fixed; bottom: 40px; right: 40px;
            width: 56px; height: 56px;
            background: var(--brand-color);
            color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; font-size: 24px;
            box-shadow: 0 8px 25px rgba(45, 106, 79, 0.4);
            z-index: 2000;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .float-add-btn:hover {
            transform: scale(1.1) rotate(90deg);
            background: #1e4d38;
        }

        /* --- 筛选面板 --- */
        .filter-panel {
            max-width: 1000px; margin: 40px auto 20px;
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px);
            padding: 20px 30px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .filter-group { display: flex; gap: 15px; align-items: center; }
        select, .btn-sort {
            padding: 8px 15px; border-radius: 8px; border: 1px solid #ddd;
            background: white; cursor: pointer; font-family: inherit; transition: 0.2s;
        }

        /* --- 笔记网格 --- */
        .note-grid {
            max-width: 1000px; margin: 0 auto 30px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px; padding: 0 20px;
        }

        .note-item {
            background: rgba(255, 255, 255, 0.92); border-radius: 15px;
            padding: 25px; transition: all 0.3s ease;
            text-decoration: none; color: inherit;
            display: flex; flex-direction: column;
            border: 1px solid rgba(255,255,255,0.3);
            min-height: 200px;
        }
        .note-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            background: #fff; border-color: var(--brand-color);
        }
        .note-item h2 { margin: 0 0 10px 0; font-size: 1.3rem; color: var(--brand-color); line-height: 1.4; }
        .note-item .date { font-size: 0.85rem; color: #777; margin-bottom: 15px; }
        .note-item .excerpt { 
            font-size: 0.9rem; line-height: 1.6; color: #444; 
            margin-bottom: 20px; flex-grow: 1;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        .mini-tag { font-size: 0.75rem; background: #eef5f1; padding: 2px 8px; border-radius: 4px; color: var(--brand-color); font-weight: bold; margin-right: 5px; margin-bottom: 5px; display: inline-block; }

        /* --- 分页按钮 --- */
        .pagination {
            max-width: 1000px; margin: 0 auto 80px;
            display: flex; justify-content: center; align-items: center; gap: 20px;
        }
        .page-info { color: white; font-size: 0.9rem; background: rgba(0,0,0,0.4); padding: 5px 15px; border-radius: 20px; }
        .pagination button { background: white; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* --- 响应式适配修复 --- */
        @media (max-width: 768px) {
            .top-nav { padding: 10px 15px; justify-content: center; text-align: center; }
            .nav-left { width: 100%; font-size: 1.1rem; margin-bottom: 8px; }
            .nav-right { width: 100%; justify-content: center; gap: 12px; }
            .nav-link { font-size: 0.85rem; padding: 2px 0; }
            .nav-search-container { display: none; }
            
            body { padding-top: 110px; } /* 增加页头间距，防止换行挡住内容 */
            
            .hero-box { padding: 25px 20px !important; margin: 0 10px; }
            .hero-box h1 { font-size: 2rem !important; margin-bottom: 15px !important; }
            .hero-box p { font-size: 0.95rem !important; line-height: 1.6 !important; }
            
            .filter-panel { flex-direction: column; gap: 15px; margin: 20px; padding: 15px; }
            .float-add-btn { bottom: 20px; right: 20px; width: 48px; height: 48px; }
        }

        @media (max-width: 480px) {
            .nav-right { gap: 8px; }
            /* 即使在超窄屏幕也保留书单等入口，改为换行显示而非直接隐藏 */
            .nav-right .nav-link { font-size: 0.8rem; } 
        }
    </style>
</head>

<body>

<audio id="bg-music" preload="auto" loop>
    <source src="Over_Reprise.mp3" type="audio/mpeg">
</audio>

<nav class="top-nav">
    <a href="index.html" class="nav-left">🌊 猫猫咩咩阅览室</a>
    
    <div class="nav-right">
        <a href="write.html" class="nav-link add-btn">➕ 添加</a>
        <a href="toread.html" class="nav-link" style="color: #d62828; font-weight: bold;">📖 书单&影单</a>
        <a href="showitem.html?type=all" class="nav-link">📚 书评&影评</a>
        <a href="showitem.html?type=report" class="nav-link">📝 AI调研笔记</a>
        <button class="music-btn" id="music-toggle" title="播放/暂停背景音乐">🎵</button>
    </div>
</nav>

<a href="write.html" class="float-add-btn" title="撰写新笔记">➕</a>

<div style="display: flex; justify-content: center; align-items: center; padding: 40px 10px; width: 100%; box-sizing: border-box;">
    <div class="hero-box" style="max-width: 800px; width: 100%; padding: 40px 60px; background: rgba(20, 20, 20, 0.4); backdrop-filter: blur(20px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3); text-align: center; color: #ffffff;">
        <h1 style="font-size: 3rem; margin: 0 0 25px 0; text-shadow: 0 2px 8px rgba(0,0,0,0.4); letter-spacing: 4px;">阅读笔记</h1>
        <p style="font-size: 1.15rem; line-height: 1.9; letter-spacing: 1px; text-align: justify; text-shadow: 0 1px 4px rgba(0,0,0,0.3); font-weight: 400; margin: 0;">
            “我们已经无法向前推进并把否定从完全物化了的语言中挤出来：人们并非没有听到拒绝和指责，相反，他们早就注意到了，只是他们听到信息之后，就把它转译成了社会学、心理学和美学问题，把其余的当成了假装自我批判的政治宣传。” <br>
            <span style="display: block; text-align: right; margin-top: 15px; opacity: 0.8;">—— 马尔库塞</span>
        </p>
        
        <a href="toread.html" class="hero-cta-btn">Our Wish List 📖</a>
    </div>
</div>

<section class="filter-panel">
    <div class="filter-group">
        <span>标签筛选:</span>
        <select id="tagFilter" onchange="resetAndRender()">
            <option value="all">全部标签</option>
        </select>
    </div>
    <div class="nav-search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="globalSearch" class="nav-search-input" placeholder="搜索标题、内容、来源..." oninput="resetAndRender()">
    </div>
    <div id="statusLabel" style="font-size: 0.9rem; color: var(--brand-color); font-weight: bold;"></div>
    <div class="filter-group">
        <span>排序:</span>
        <button class="btn-sort" onclick="sortNotes('desc')">倒序</button>
        <button class="btn-sort" onclick="sortNotes('asc')">正序</button>
    </div>
</section>

<div class="note-grid" id="noteGrid"></div>
<div class="pagination" id="paginationBar"></div>

<script src="notedata.js"></script>

<script>
    let currentSort = 'desc';
    let currentPage = 1;
    const pageSize = 12;

    document.addEventListener('DOMContentLoaded', () => {
        const audio = document.getElementById('bg-music');
        const btn = document.getElementById('music-toggle');
        audio.muted = true;
        audio.load();

        btn.addEventListener('click', () => {
            if (audio.paused) {
                audio.muted = false;
                audio.play().then(() => {
                    btn.classList.add('playing');
                    btn.textContent = '⏸️';
                }).catch(err => {
                    alert('播放失败：请点击页面任意位置后再试。');
                });
            } else {
                audio.pause();
                btn.classList.remove('playing');
                btn.textContent = '🎵';
            }
        });
    });

    function initFilters() {
        const selector = document.getElementById('tagFilter');
        const tags = new Set();
        if(typeof ALL_NOTES !== 'undefined') {
            Object.values(ALL_NOTES).forEach(note => {
                if (note.tag && Array.isArray(note.tag)) {
                    note.tag.forEach(t => tags.add(t));
                }
            });
        }
        const sortedTags = Array.from(tags).sort();
        sortedTags.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t;
            opt.innerText = "# " + t;
            selector.appendChild(opt);
        });
    }

    function resetAndRender() {
        currentPage = 1;
        renderNotes();
    }

    function sortNotes(order) {
        currentSort = order;
        currentPage = 1;
        renderNotes();
    }

    function changePage(step) {
        currentPage += step;
        renderNotes();
        window.scrollTo({ top: document.querySelector('.filter-panel').offsetTop - 100, behavior: 'smooth' });
    }

    function renderNotes() {
        const grid = document.getElementById('noteGrid');
        const pagiBar = document.getElementById('paginationBar');
        const tagFilter = document.getElementById('tagFilter').value;
        const searchQuery = document.getElementById('globalSearch').value.toLowerCase().trim();
        const statusLabel = document.getElementById('statusLabel');
        
        if (typeof ALL_NOTES === 'undefined') return;

        let notesList = Object.keys(ALL_NOTES).map(id => ({ id: id, ...ALL_NOTES[id] }));

        if (searchQuery) {
            notesList = notesList.filter(n => {
                const inTitle = (n.title || "").toLowerCase().includes(searchQuery);
                const inSource = (n.source || "").toLowerCase().includes(searchQuery);
                const inDetail = (n.detail || "").toLowerCase().includes(searchQuery);
                return inTitle || inSource || inDetail;
            });
            statusLabel.innerText = `找到 ${notesList.length} 条结果`;
        } else {
            statusLabel.innerText = "";
        }

        if (tagFilter !== 'all') {
            notesList = notesList.filter(n => n.tag && n.tag.includes(tagFilter));
        }

        notesList.sort((a, b) => {
            const dateA = new Date(a.time || 0);
            const dateB = new Date(b.time || 0);
            return currentSort === 'desc' ? dateB - dateA : dateA - dateB;
        });

        const totalItems = notesList.length;
        const totalPages = Math.ceil(totalItems / pageSize);
        const start = (currentPage - 1) * pageSize;
        const end = start + pageSize;
        const pagedNotes = notesList.slice(start, end);

        if (pagedNotes.length === 0) {
            grid.innerHTML = `<div style="color:white; grid-column: 1/-1; text-align:center; padding: 100px; background: rgba(0,0,0,0.2); border-radius: 15px;">未能找到相关笔记</div>`;
            pagiBar.innerHTML = "";
            return;
        }

        grid.innerHTML = pagedNotes.map(n => {
            const firstContent = n.contents && n.contents[0] ? n.contents[0] : {};
            const rawText = firstContent.material || (firstContent.comments ? firstContent.comments[0] : "") || "暂无预览内容";
            const excerpt = rawText.replace(/<[^>]+>/g, '').substring(0, 85);
            const displayTags = (n.tag || []).map(t => `<span class="mini-tag">#${t}</span>`).join('');

            return `
                <a href="note.html?id=${n.id}" class="note-item">
                    <h2>${n.title || '无标题'}</h2>
                    <div class="date">📅 ${n.time || '未知日期'}</div>
                    <div class="excerpt">${excerpt}${rawText.length > 85 ? '...' : ''}</div>
                    <div class="note-tags">${displayTags}</div>
                </a>
            `;
        }).join('');

        if (totalPages > 1) {
            pagiBar.innerHTML = `
                <button onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>
                <span class="page-info">第 ${currentPage} / ${totalPages} 页</span>
                <button onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>
            `;
        } else {
            pagiBar.innerHTML = "";
        }
    }

    window.onload = () => {
        initFilters();
        renderNotes();
    };
</script>

</body>
</html>
